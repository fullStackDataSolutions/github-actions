name: E2E Tests
description: >-
  Installs dependencies, downloads the Next.js build produced by the quality
  job, and runs Playwright e2e tests against a Postgres service container.
  The calling job must checkout the repo, define the postgres service
  container, and pass its bound port in via e2e-postgres-port.

inputs:
  working-directory:
    required: true
  node-version:
    required: true
  pnpm-version:
    required: true
  e2e-setup-command:
    required: false
    default: ''
  e2e-postgres-user:
    required: false
    default: postgres
  e2e-postgres-password:
    required: false
    default: postgres
  e2e-postgres-db:
    required: false
    default: postgres
  e2e-postgres-port:
    description: Host port the postgres service container is bound to (job.services.postgres.ports['5432'])
    required: true
  e2e-infisical-environment:
    required: false
    default: ''
  e2e-setup-cache-path:
    required: false
    default: ''
  e2e-setup-build-command:
    required: false
    default: ''
    description: >-
      Optional command (e.g. `pnpm --dir backend run build`) run before
      e2e-setup-command, to prebuild a sibling directory's compiled
      output. The build output at e2e-setup-cache-path/dist is cached,
      keyed on that directory's source files, so unchanged code skips
      rebuilding entirely. Only runs if e2e-setup-cache-path is also set.
  backend-infisical-site-url:
    required: false
    default: ''
  backend-infisical-client-id:
    required: false
    default: ''
  backend-infisical-client-secret:
    required: false
    default: ''
  backend-infisical-project-id:
    required: false
    default: ''
  frontend-infisical-site-url:
    required: false
    default: ''
  frontend-infisical-client-id:
    required: false
    default: ''
  frontend-infisical-client-secret:
    required: false
    default: ''
  frontend-infisical-project-id:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-node-modules-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ github.repository }}-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: pnpm exec playwright install chromium

    - name: Compute Next.js build artifact name
      id: nextjs-artifact-name
      shell: bash
      run: echo "name=nextjs-build-$(echo '${{ inputs.working-directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

    - name: Download Next.js build
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.nextjs-artifact-name.outputs.name }}
        path: ${{ inputs.working-directory }}/.next

    - name: Prepare standalone Next.js server assets
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        if [ -d .next/standalone ]; then
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          # Next's output file tracer doesn't always capture every
          # transitive dependency correctly (e.g. optional/dynamic
          # requires) - symlink the fully-installed node_modules over
          # the tracer's possibly-incomplete one rather than trust it.
          rm -rf .next/standalone/node_modules
          ln -s "$(pwd)/node_modules" .next/standalone/node_modules
        fi

    - name: Cache e2e setup dependencies
      if: ${{ inputs.e2e-setup-cache-path != '' }}
      uses: actions/cache@v6
      with:
        path: ${{ inputs.e2e-setup-cache-path }}/node_modules
        key: ${{ runner.os }}-node-modules-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.e2e-setup-cache-path }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.e2e-setup-cache-path)) }}

    - name: Cache e2e setup build output
      id: e2e-setup-build-cache
      if: ${{ inputs.e2e-setup-build-command != '' && inputs.e2e-setup-cache-path != '' }}
      uses: actions/cache@v6
      with:
        path: ${{ inputs.e2e-setup-cache-path }}/dist
        key: ${{ runner.os }}-build-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.e2e-setup-cache-path }}-${{ hashFiles(format('{0}/src/**', inputs.e2e-setup-cache-path), format('{0}/package.json', inputs.e2e-setup-cache-path), format('{0}/tsconfig*.json', inputs.e2e-setup-cache-path)) }}

    - name: Run e2e setup build command
      if: ${{ inputs.e2e-setup-build-command != '' && steps.e2e-setup-build-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: ${{ inputs.e2e-setup-build-command }}

    - name: Run e2e stack setup
      if: ${{ inputs.e2e-setup-command != '' }}
      shell: bash
      run: ${{ inputs.e2e-setup-command }}
      env:
        E2E_POSTGRES_HOST: localhost
        E2E_POSTGRES_PORT: ${{ inputs.e2e-postgres-port }}
        E2E_POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
        E2E_POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
        E2E_POSTGRES_DB: ${{ inputs.e2e-postgres-db }}
        INFISICAL_SITE_URL: ${{ inputs.backend-infisical-site-url }}
        INFISICAL_CLIENT_ID: ${{ inputs.backend-infisical-client-id }}
        INFISICAL_CLIENT_SECRET: ${{ inputs.backend-infisical-client-secret }}
        INFISICAL_PROJECT_ID: ${{ inputs.backend-infisical-project-id }}
        INFISICAL_ENVIRONMENT: ${{ inputs.e2e-infisical-environment }}

    - name: Run e2e tests
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: pnpm test:e2e
      env:
        E2E_PREBUILT_FRONTEND: 'true'
        E2E_POSTGRES_HOST: localhost
        E2E_POSTGRES_PORT: ${{ inputs.e2e-postgres-port }}
        E2E_POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
        E2E_POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
        E2E_POSTGRES_DB: ${{ inputs.e2e-postgres-db }}
        INFISICAL_SITE_URL: ${{ inputs.frontend-infisical-site-url }}
        INFISICAL_CLIENT_ID: ${{ inputs.frontend-infisical-client-id }}
        INFISICAL_CLIENT_SECRET: ${{ inputs.frontend-infisical-client-secret }}
        INFISICAL_PROJECT_ID: ${{ inputs.frontend-infisical-project-id }}
        INFISICAL_ENVIRONMENT: ${{ inputs.e2e-infisical-environment }}

    - name: Compute artifact name
      if: always()
      id: artifact-name
      shell: bash
      run: echo "name=playwright-report-$(echo '${{ inputs.working-directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: ${{ inputs.working-directory }}/playwright-report
        retention-days: 7
        if-no-files-found: ignore
