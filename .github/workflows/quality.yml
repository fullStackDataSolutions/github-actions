name: Quality

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
      nextjs-cache:
        required: false
        type: boolean
        default: false
      e2e-enabled:
        required: false
        type: boolean
        default: true
        description: >-
          Whether the caller's e2e job might run and need this job's Next.js
          build artifact. The upload step is skipped entirely when false,
          since a caller that never runs e2e was uploading a build artifact
          nothing ever downloaded - burning Actions storage quota on every
          single run for no reason.

jobs:
  quality:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Validate working-directory
        run: |
          if [[ "${{ inputs.working-directory }}" == *".."* ]] || [[ "${{ inputs.working-directory }}" == /* ]]; then
            echo "Error: Invalid working-directory: ${{ inputs.working-directory }}"
            exit 1
          fi
          if [ ! -d "${{ inputs.working-directory }}" ]; then
            echo "Error: Directory '${{ inputs.working-directory }}' does not exist"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: pnpm typecheck

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: pnpm lint

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: pnpm test -- --coverage --silent

      - name: Cache Next.js build
        if: ${{ inputs.nextjs-cache }}
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: pnpm build

      - name: Compute Next.js build artifact name
        id: nextjs-artifact-name
        run: echo "name=nextjs-build-$(echo '${{ inputs.working-directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      # Off by default account-wide: this org is on GitHub's free Actions
      # storage tier (no org-level Actions variables to flip this in one
      # place), and every account-wide repo blew through that quota
      # uploading this artifact on every run whether e2e needed it or not.
      # A repo that genuinely needs its e2e job to have the build available
      # opts back in by setting its own repo variable
      # CI_ARTIFACT_UPLOAD_ENABLED=true (Settings > Secrets and variables >
      # Actions > Variables).
      - name: Upload Next.js build
        if: ${{ inputs.e2e-enabled && vars.CI_ARTIFACT_UPLOAD_ENABLED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.nextjs-artifact-name.outputs.name }}
          path: |
            ${{ inputs.working-directory }}/.next
            !${{ inputs.working-directory }}/.next/cache
          retention-days: 1
          include-hidden-files: true
