name: CI
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
      nextjs-cache:
        required: false
        type: boolean
        default: false
      e2e-enabled:
        required: false
        type: boolean
        default: true
        description: >-
          Whether to run the e2e job when e2e tests are detected
          (a playwright.config.ts/.js in working-directory). Set to false
          to skip e2e entirely regardless of detection.
      e2e-setup-command:
        required: false
        type: string
        default: ''
        description: >-
          Optional shell command (or path to a script in the caller repo)
          run before the e2e tests, e.g. to start sibling services and run
          migrations. Receives E2E_POSTGRES_HOST/PORT/USER/PASSWORD/DB env
          vars pointing at the postgres service below. Needs
          `secrets: inherit` on the caller's `uses:` block if it requires
          secrets.
      e2e-postgres-user:
        required: false
        type: string
        default: postgres
      e2e-postgres-password:
        required: false
        type: string
        default: postgres
      e2e-postgres-db:
        required: false
        type: string
        default: postgres
      e2e-postgres-image:
        required: false
        type: string
        default: postgres:18
        description: >-
          Docker image for the e2e job's postgres service. Defaults to
          plain postgres:18 - override with a variant like
          postgis/postgis:18-3.6 if the caller's migrations need
          extensions plain postgres doesn't ship.
      e2e-infisical-environment:
        required: false
        type: string
        default: ''
        description: >-
          Infisical environment slug to load secrets from for the e2e job.
          Leave empty to skip Infisical entirely (both the e2e stack setup
          command and the e2e test run boot with only the env already set).
          Reads BACKEND_INFISICAL_SITE_URL/CLIENT_ID/CLIENT_SECRET/PROJECT_ID
          for the e2e stack setup step and
          FRONTEND_INFISICAL_SITE_URL/CLIENT_ID/CLIENT_SECRET/PROJECT_ID for
          the e2e test run, via `secrets: inherit` on the caller's `uses:`
          block.
      e2e-setup-cache-path:
        required: false
        type: string
        default: ''
        description: >-
          Optional sibling directory (e.g. a backend service the
          e2e-setup-command installs and starts) whose node_modules should
          be cached, keyed on that directory's own pnpm-lock.yaml. Leave
          empty to skip - e2e-setup-command's own dependency install will
          then run uncached every time.
      e2e-setup-build-command:
        required: false
        type: string
        default: ''
        description: >-
          Optional command (e.g. `pnpm --dir backend run build`) run
          before e2e-setup-command, to prebuild a sibling directory's
          compiled output. The build output at e2e-setup-cache-path/dist
          is cached, keyed on that directory's source files. Only runs
          if e2e-setup-cache-path is also set.

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      working-directory: ${{ inputs.working-directory }}
      node-version: ${{ inputs.node-version }}
      pnpm-version: ${{ inputs.pnpm-version }}
      nextjs-cache: ${{ inputs.nextjs-cache }}
      e2e-enabled: ${{ inputs.e2e-enabled }}
    secrets: inherit

  detect-e2e:
    if: ${{ inputs.e2e-enabled }}
    runs-on: self-hosted
    outputs:
      has-e2e: ${{ steps.detect.outputs.has-e2e }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect e2e tests
        id: detect
        run: |
          if [ -f "${{ inputs.working-directory }}/playwright.config.ts" ] || [ -f "${{ inputs.working-directory }}/playwright.config.js" ]; then
            echo "has-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: [detect-e2e, quality]
    if: ${{ inputs.e2e-enabled && needs.detect-e2e.outputs.has-e2e == 'true' }}
    runs-on: self-hosted
    services:
      postgres:
        image: ${{ inputs.e2e-postgres-image }}
        env:
          POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
          POSTGRES_DB: ${{ inputs.e2e-postgres-db }}
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: fullStackDataSolutions/github-actions/.github/actions/e2e@main
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          e2e-setup-command: ${{ inputs.e2e-setup-command }}
          e2e-postgres-user: ${{ inputs.e2e-postgres-user }}
          e2e-postgres-password: ${{ inputs.e2e-postgres-password }}
          e2e-postgres-db: ${{ inputs.e2e-postgres-db }}
          e2e-postgres-port: ${{ job.services.postgres.ports['5432'] }}
          e2e-infisical-environment: ${{ inputs.e2e-infisical-environment }}
          e2e-setup-cache-path: ${{ inputs.e2e-setup-cache-path }}
          e2e-setup-build-command: ${{ inputs.e2e-setup-build-command }}
          backend-infisical-site-url: ${{ secrets.BACKEND_INFISICAL_SITE_URL }}
          backend-infisical-client-id: ${{ secrets.BACKEND_INFISICAL_CLIENT_ID }}
          backend-infisical-client-secret: ${{ secrets.BACKEND_INFISICAL_CLIENT_SECRET }}
          backend-infisical-project-id: ${{ secrets.BACKEND_INFISICAL_PROJECT_ID }}
          frontend-infisical-site-url: ${{ secrets.FRONTEND_INFISICAL_SITE_URL }}
          frontend-infisical-client-id: ${{ secrets.FRONTEND_INFISICAL_CLIENT_ID }}
          frontend-infisical-client-secret: ${{ secrets.FRONTEND_INFISICAL_CLIENT_SECRET }}
          frontend-infisical-project-id: ${{ secrets.FRONTEND_INFISICAL_PROJECT_ID }}
