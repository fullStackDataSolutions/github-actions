name: CI
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
      sonar-enabled:
        required: false
        type: boolean
        default: false
      nextjs-cache:
        required: false
        type: boolean
        default: false
      e2e-enabled:
        required: false
        type: boolean
        default: true
        description: >-
          Whether to run e2e tests when they're detected (a
          playwright.config.ts/.js in working-directory). Set to false to
          skip e2e entirely regardless of detection.
      e2e-setup-command:
        required: false
        type: string
        default: ''
        description: >-
          Optional shell command (or path to a script in the caller repo)
          run before the e2e tests, e.g. to start sibling services and run
          migrations. Receives E2E_POSTGRES_HOST/PORT/USER/PASSWORD/DB env
          vars pointing at the postgres service below. Needs
          `secrets: inherit` on the caller's `uses:` block if it requires
          secrets.
      e2e-postgres-user:
        required: false
        type: string
        default: postgres
      e2e-postgres-password:
        required: false
        type: string
        default: postgres
      e2e-postgres-db:
        required: false
        type: string
        default: postgres

jobs:
  build:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
          POSTGRES_DB: ${{ inputs.e2e-postgres-db }}
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate working-directory
        run: |
          if [[ "${{ inputs.working-directory }}" == *".."* ]] || [[ "${{ inputs.working-directory }}" == /* ]]; then
            echo "Error: Invalid working-directory: ${{ inputs.working-directory }}"
            exit 1
          fi
          if [ ! -d "${{ inputs.working-directory }}" ]; then
            echo "Error: Directory '${{ inputs.working-directory }}' does not exist"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: pnpm typecheck

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: pnpm lint

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: pnpm test -- --coverage

      - name: Detect e2e tests
        id: detect-e2e
        if: ${{ inputs.e2e-enabled }}
        run: |
          if [ -f "${{ inputs.working-directory }}/playwright.config.ts" ] || [ -f "${{ inputs.working-directory }}/playwright.config.js" ]; then
            echo "has-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browsers
        if: ${{ inputs.e2e-enabled && steps.detect-e2e.outputs.has-e2e == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e stack setup
        if: ${{ inputs.e2e-enabled && steps.detect-e2e.outputs.has-e2e == 'true' && inputs.e2e-setup-command != '' }}
        run: ${{ inputs.e2e-setup-command }}
        env:
          E2E_POSTGRES_HOST: localhost
          E2E_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          E2E_POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
          E2E_POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
          E2E_POSTGRES_DB: ${{ inputs.e2e-postgres-db }}

      - name: Run e2e tests
        if: ${{ inputs.e2e-enabled && steps.detect-e2e.outputs.has-e2e == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ always() && inputs.e2e-enabled && steps.detect-e2e.outputs.has-e2e == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.working-directory }}
          path: ${{ inputs.working-directory }}/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: SonarQube Scan
        if: ${{ inputs.sonar-enabled }}
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Next.js build
        if: ${{ inputs.nextjs-cache }}
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: pnpm build
