name: CI
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
      sonar-enabled:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate working-directory
        run: |
          if [[ "${{ inputs.working-directory }}" == *".."* ]] || [[ "${{ inputs.working-directory }}" == /* ]]; then
            echo "Error: Invalid working-directory: ${{ inputs.working-directory }}"
            exit 1
          fi
          if [ ! -d "${{ inputs.working-directory }}" ]; then
            echo "Error: Directory '${{ inputs.working-directory }}' does not exist"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: pnpm typecheck

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: pnpm lint

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: pnpm test --coverage

      - name: SonarQube Scan
        if: ${{ inputs.sonar-enabled }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: pnpm build
