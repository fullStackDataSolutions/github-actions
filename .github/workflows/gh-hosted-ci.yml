name: CI
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      node-version:
        required: true
        type: string
      pnpm-version:
        required: true
        type: string
      sonar-enabled:
        required: false
        type: boolean
        default: false
      nextjs-cache:
        required: false
        type: boolean
        default: false
      e2e-enabled:
        required: false
        type: boolean
        default: true
        description: >-
          Whether to run the e2e job when e2e tests are detected
          (a playwright.config.ts/.js in working-directory). Set to false
          to skip e2e entirely regardless of detection.
      e2e-setup-command:
        required: false
        type: string
        default: ''
        description: >-
          Optional shell command (or path to a script in the caller repo)
          run before the e2e tests, e.g. to start sibling services and run
          migrations. Receives E2E_POSTGRES_HOST/PORT/USER/PASSWORD/DB env
          vars pointing at the postgres service below. Needs
          `secrets: inherit` on the caller's `uses:` block if it requires
          secrets.
      e2e-postgres-user:
        required: false
        type: string
        default: postgres
      e2e-postgres-password:
        required: false
        type: string
        default: postgres
      e2e-postgres-db:
        required: false
        type: string
        default: postgres
      e2e-infisical-environment:
        required: false
        type: string
        default: ''
        description: >-
          Infisical environment slug to load secrets from for the e2e job.
          Leave empty to skip Infisical entirely (both the e2e stack setup
          command and the e2e test run boot with only the env already set).
          Reads BACKEND_INFISICAL_SITE_URL/CLIENT_ID/CLIENT_SECRET/PROJECT_ID
          for the e2e stack setup step and
          FRONTEND_INFISICAL_SITE_URL/CLIENT_ID/CLIENT_SECRET/PROJECT_ID for
          the e2e test run, via `secrets: inherit` on the caller's `uses:`
          block.
      e2e-setup-cache-path:
        required: false
        type: string
        default: ''
        description: >-
          Optional sibling directory (e.g. a backend service the
          e2e-setup-command installs and starts) whose node_modules should
          be cached, keyed on that directory's own pnpm-lock.yaml. Leave
          empty to skip - e2e-setup-command's own dependency install will
          then run uncached every time.

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate working-directory
        run: |
          if [[ "${{ inputs.working-directory }}" == *".."* ]] || [[ "${{ inputs.working-directory }}" == /* ]]; then
            echo "Error: Invalid working-directory: ${{ inputs.working-directory }}"
            exit 1
          fi
          if [ ! -d "${{ inputs.working-directory }}" ]; then
            echo "Error: Directory '${{ inputs.working-directory }}' does not exist"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: pnpm typecheck

      - name: Lint
        working-directory: ${{ inputs.working-directory }}
        run: pnpm lint

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: pnpm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage/lcov.info
          retention-days: 1
          if-no-files-found: warn

  sonar:
    needs: quality
    if: ${{ inputs.sonar-enabled }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: ${{ inputs.working-directory }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  detect-e2e:
    if: ${{ inputs.e2e-enabled }}
    runs-on: ubuntu-latest
    outputs:
      has-e2e: ${{ steps.detect.outputs.has-e2e }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect e2e tests
        id: detect
        run: |
          if [ -f "${{ inputs.working-directory }}/playwright.config.ts" ] || [ -f "${{ inputs.working-directory }}/playwright.config.js" ]; then
            echo "has-e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: [detect-e2e, build]
    if: ${{ inputs.e2e-enabled && needs.detect-e2e.outputs.has-e2e == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
          POSTGRES_DB: ${{ inputs.e2e-postgres-db }}
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ github.repository }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Compute Next.js build artifact name
        id: nextjs-artifact-name
        run: echo "name=nextjs-build-$(echo '${{ inputs.working-directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Download Next.js build
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.nextjs-artifact-name.outputs.name }}
          path: ${{ inputs.working-directory }}/.next
      - name: Cache e2e setup dependencies
        if: ${{ inputs.e2e-setup-cache-path != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ inputs.e2e-setup-cache-path }}/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.e2e-setup-cache-path }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.e2e-setup-cache-path)) }}
      - name: Run e2e stack setup
        if: ${{ inputs.e2e-setup-command != '' }}
        run: ${{ inputs.e2e-setup-command }}
        env:
          E2E_POSTGRES_HOST: localhost
          E2E_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          E2E_POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
          E2E_POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
          E2E_POSTGRES_DB: ${{ inputs.e2e-postgres-db }}
          INFISICAL_SITE_URL: ${{ secrets.BACKEND_INFISICAL_SITE_URL }}
          INFISICAL_CLIENT_ID: ${{ secrets.BACKEND_INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.BACKEND_INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.BACKEND_INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ inputs.e2e-infisical-environment }}
      - name: Run e2e tests
        working-directory: ${{ inputs.working-directory }}
        run: pnpm test:e2e
        env:
          E2E_PREBUILT_FRONTEND: 'true'
          E2E_POSTGRES_HOST: localhost
          E2E_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          E2E_POSTGRES_USER: ${{ inputs.e2e-postgres-user }}
          E2E_POSTGRES_PASSWORD: ${{ inputs.e2e-postgres-password }}
          E2E_POSTGRES_DB: ${{ inputs.e2e-postgres-db }}
          INFISICAL_SITE_URL: ${{ secrets.FRONTEND_INFISICAL_SITE_URL }}
          INFISICAL_CLIENT_ID: ${{ secrets.FRONTEND_INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.FRONTEND_INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.FRONTEND_INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: ${{ inputs.e2e-infisical-environment }}
      - name: Compute artifact name
        if: always()
        id: artifact-name
        run: echo "name=playwright-report-$(echo '${{ inputs.working-directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ inputs.working-directory }}/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  build:
    needs: [quality, detect-e2e]
    if: ${{ !cancelled() && needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ runner.os }}-node-modules-${{ github.repository }}-${{ inputs.node-version }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile
      - name: Cache Next.js build
        if: ${{ inputs.nextjs-cache }}
        uses: actions/cache@v6
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-${{ github.repository }}-${{ inputs.working-directory }}-
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: pnpm build
      - name: Compute Next.js build artifact name
        if: ${{ needs.detect-e2e.outputs.has-e2e == 'true' }}
        id: nextjs-artifact-name
        run: echo "name=nextjs-build-$(echo '${{ inputs.working-directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Upload Next.js build
        if: ${{ needs.detect-e2e.outputs.has-e2e == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.nextjs-artifact-name.outputs.name }}
          path: ${{ inputs.working-directory }}/.next
          retention-days: 1
          include-hidden-files: true
